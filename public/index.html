/* Layout: white header with a leaf-sun-tulip stripe from the logo, tab strip, one content column (max 1100px); cards only for tiles, panels, dialogs */
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --sunk:#F3EDE0; --line:#E7DCC7; --ink:#2E1C12; --muted:#7A6454;
  --accent:#2F7A45; --accent-ink:#FFFFFF; --accent-soft:#E2F0E3; --accent-2:#8DB86B;
  --sun:#F2B01E; --sun-strong:#E58A0C; --sun-soft:#FDF0CF; --tulip:#CF3523; --band:#E3B193; --band-soft:#F7E6DA;
  --ok:#2F7A45; --ok-soft:#E2F0E3; --warn:#A15F00; --warn-soft:#FCEFD2; --bad:#C2321F; --bad-soft:#FAE3DE; --info:#2F5E96; --info-soft:#E1EAF5;
  --f-display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-ui:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14130E; --surface:#1E1C15; --sunk:#111009; --line:#363226; --ink:#F1EADC; --muted:#AA9E89;
  --accent:#6FC48A; --accent-ink:#0C1A10; --accent-soft:#1F3524; --accent-2:#A6CF83;
  --sun:#F6C24A; --sun-strong:#F4A43A; --sun-soft:#3A2E12; --tulip:#F0705E; --band:#B98466; --band-soft:#352419;
  --ok:#6FC48A; --ok-soft:#1F3524; --warn:#EDB453; --warn-soft:#3A2B10; --bad:#F0705E; --bad-soft:#3E1D17; --info:#8DB4EA; --info-soft:#1A2A40;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130E; --surface:#1E1C15; --sunk:#111009; --line:#363226; --ink:#F1EADC; --muted:#AA9E89;
  --accent:#6FC48A; --accent-ink:#0C1A10; --accent-soft:#1F3524; --accent-2:#A6CF83;
  --sun:#F6C24A; --sun-strong:#F4A43A; --sun-soft:#3A2E12; --tulip:#F0705E; --band:#B98466; --band-soft:#352419;
  --ok:#6FC48A; --ok-soft:#1F3524; --warn:#EDB453; --warn-soft:#3A2B10; --bad:#F0705E; --bad-soft:#3E1D17; --info:#8DB4EA; --info-soft:#1A2A40;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
h3{font-family:var(--f-ui);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgb(46 28 18 / .03)}
header.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--accent) 0 38%,var(--accent-2) 38% 56%,var(--sun) 56% 84%,var(--tulip) 84% 100%)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.mark.logo{width:auto;height:44px;background:#fff;border-radius:8px;padding:2px 4px;object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.logo-login{justify-self:center;height:110px;width:auto;align-self:flex-start;background:#fff;border-radius:12px;padding:4px 8px;box-shadow:0 0 0 1px var(--line)}
.brand{min-width:0;flex:1}
.brand h1{font-size:1.35rem;line-height:1.15;color:var(--ink)}
.brand p{margin:0;font-size:.8rem;color:var(--muted)}
.mode{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.mode.on{background:var(--ok-soft);color:var(--ok)}
.mode.warn{background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 11px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--sun)}
.tab:hover{color:var(--ink)}
.tab .ct{font-size:.72rem;background:var(--sunk);padding:0 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.tab .ct.hot{background:var(--bad-soft);color:var(--bad)}

main{padding-block:22px 64px;display:grid;gap:22px}
main>*{min-width:0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.6rem;color:var(--ink)}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 0 rgb(0 0 0 / .08), inset 0 -2px 0 rgb(0 0 0 / .12)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;align-content:start;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:70px;height:70px;border-radius:50%;background:var(--sun-soft);opacity:.8;pointer-events:none}
.tile>*{position:relative;z-index:1}
.tile .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--f-ui);font-size:clamp(1.2rem,2.1vw,1.6rem);white-space:nowrap;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.82rem;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2) 70%,var(--sun));border-radius:99px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:1.02rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media (max-width:420px){.cols{grid-template-columns:1fr}}

.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.8rem;color:var(--muted)}
.house{font-family:var(--f-mono);font-size:.8rem;font-weight:500;background:var(--band-soft);color:var(--ink);border:1px solid var(--band);padding:1px 7px;border-radius:5px;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.chip.plain::before{display:none}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 220px;min-width:0}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0}
textarea{resize:vertical;min-height:80px}
select{cursor:pointer}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunk);border-bottom:2px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.kel-tbl table{min-width:640px}
.kel-tbl td,.kel-tbl th{white-space:nowrap}
.nik-cell{display:inline-flex;align-items:center;gap:6px}
.nik-cell .mono{min-width:15ch}
.nik-cell .btn{padding:3px 8px;font-size:.78rem;color:var(--accent)}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{font-family:var(--f-display);font-size:1.15rem;min-width:9.5ch;text-align:center}

.kel-list{display:grid;gap:10px}
.kel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;border-left:4px solid var(--line)}
.kel.p-Tinggi{border-left-color:var(--bad)}
.kel.p-Sedang{border-left-color:var(--warn)}
.kel.p-Rendah{border-left-color:var(--info)}
.kel .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.kel h4{margin:0;font-size:1.02rem}
.kel p{margin:0}
.kel .resp{background:var(--sunk);border-radius:8px;padding:8px 11px;font-size:.88rem}

.kel .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.15rem}
.empty .toolbar{justify-content:center}

.chart svg{width:100%;max-width:760px;height:auto;display:block;margin-inline:auto}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.chart .vlbl{fill:var(--ink);font-weight:600}

.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:.88rem}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgb(10 20 15 / .45)}

.dlg-h{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.dlg-b{padding:8px 18px 14px;overflow:auto;display:grid;gap:12px}

.fld{display:grid;gap:4px;min-width:0}
.fld .nik-info.kurang{color:var(--bad);font-weight:600}
.fld .nik-info.pas{color:var(--ok);font-weight:600}
.nik-ok{border-color:var(--ok)!important}
.ag-sec{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ag-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ag-head b{font-family:var(--f-display);font-size:1rem}
.ag-list{display:grid;gap:10px}
.ag-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:grid;gap:10px;background:var(--bg)}
.ag-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--muted)}
.ag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ag-empty{font-size:.85rem;color:var(--muted);margin:0}
.dlg-msg{margin:0 18px 10px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:.88rem;font-weight:500;display:flex;gap:8px;align-items:flex-start}
.dlg-msg[hidden],.ag-empty[hidden]{display:none}
.dlg-msg::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;background:var(--bad);color:var(--bad-soft);font-weight:700;font-size:.75rem;display:grid;place-items:center;margin-top:1px}
[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.fld label{font-size:.8rem;font-weight:600}
.fld .hint{font-size:.76rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.req{color:var(--bad)}

#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.88rem;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.4}}}

.skel{color:var(--muted);padding:30px 0;text-align:center}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who img,.av{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover;background:var(--sunk)}

.who .rl{font-size:.72rem;color:var(--muted)}
.login{max-width:440px;margin:6vh auto 0;background:radial-gradient(120% 60% at 50% -10%,var(--sun-soft),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:16px}

.login .btn.pri{justify-content:center;padding:11px 16px;font-size:1rem}
.login .fine{font-size:.8rem;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:12px}
.role-sel{width:auto;padding:5px 8px;font-size:.85rem}
[hidden]{display:none!important}
.user-list{display:grid;gap:8px}
.user-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.user-opt:hover:not(:disabled){border-color:var(--accent)}
.user-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

.user-opt .av{width:38px;height:38px}
.user-opt .grow{flex:1;min-width:0;display:grid}
.user-opt .t{font-weight:600}
.user-opt .s{font-size:.8rem;color:var(--muted)}
.user-opt .lock{color:var(--muted);font-size:.95rem}
.login-pin{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
#pinMasuk{font-size:1.3rem;letter-spacing:.4em;text-align:center}
.login-pin .btn.pri{justify-content:center;padding:11px 16px;font-size:1rem}
.minta-box{font-size:.9rem}

.minta-box[open]{display:grid;gap:10px}
.av-i{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.72rem}
.izin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,180px);gap:8px 12px;align-items:center;background:var(--sunk);border-radius:10px;padding:12px}

.list-mobile{display:none}
.tab svg{width:18px;height:18px;flex:none}

nav.tabs:empty{display:none}

/* ===== Modern layer: sidebar app shell on desktop, floating pill nav on phones, soft cards, pill controls ===== */
:root{
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px; --r-sm:12px;
  --line-soft:#EFE7D7;
  --shadow:0 1px 2px rgb(46 28 18 / .04),0 8px 24px -14px rgb(46 28 18 / .18);
  --shadow-lg:0 2px 6px rgb(46 28 18 / .05),0 24px 48px -20px rgb(46 28 18 / .28);
  --glass:rgb(255 255 255 / .82);
  --side:264px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--line-soft:#2C2920;--shadow:0 1px 0 rgb(0 0 0 / .35);--shadow-lg:0 20px 40px -18px rgb(0 0 0 / .6);--glass:rgb(30 28 21 / .82)}}
:root[data-theme="dark"]{--line-soft:#2C2920;--shadow:0 1px 0 rgb(0 0 0 / .35);--shadow-lg:0 20px 40px -18px rgb(0 0 0 / .6);--glass:rgb(30 28 21 / .82)}

body{font-size:15px;background:
  radial-gradient(900px 520px at 105% -12%,color-mix(in srgb,var(--sun) 13%,transparent),transparent 62%),
  radial-gradient(760px 520px at -12% 112%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 62%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em}
h3{font-weight:700;letter-spacing:-.01em}
.sec-head h2{font-size:1.75rem}
.sec-head p{font-size:.92rem}

/* header (tablet default) */
header.top{background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft);box-shadow:none}
header.top::before{height:3px}
.mark.logo{border-radius:12px;box-shadow:0 0 0 1px var(--line-soft),0 4px 12px -6px rgb(46 28 18 / .25)}
.brand h1{font-weight:800;letter-spacing:-.02em}
.tab{border-radius:999px;border-bottom:0;padding:8px 13px;margin-block:6px 8px;font-weight:600;transition:background .15s,color .15s}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-bottom:0;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.tab[aria-selected="true"] .ct{background:rgb(255 255 255 / .22);color:inherit}
.who{background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:3px 4px 3px 4px}
.who .btn{border-radius:999px}

/* surfaces */
.panel,.tile,.kel,article.info,.tbl-wrap,.list-mobile,.empty,.kw{border-radius:var(--r)}
.panel,.tile,.kel,article.info,.tbl-wrap,.list-mobile{border-color:var(--line-soft);box-shadow:var(--shadow)}
.panel{padding:18px 20px}
.panel h3{font-size:1.05rem;margin-bottom:12px}
.empty{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.tile{padding:16px 18px;gap:4px;transition:transform .15s,box-shadow .15s}
.tile::after{display:none}
.tile:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.tile .lbl{text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:600}
.tile{container-type:inline-size}
.tile .val{font-weight:800;letter-spacing:-.025em;font-size:clamp(1.15rem,14.5cqi,1.85rem)}
.ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px}
.ti svg{width:20px;height:20px}
.ti.g{background:var(--accent-soft);color:var(--accent)} .ti.s{background:var(--sun-soft);color:var(--sun-strong)}
.ti.r{background:var(--bad-soft);color:var(--bad)} .ti.b{background:var(--info-soft);color:var(--info)}
.meter{height:8px}
.kel{border-left-width:5px}

/* controls */
.btn{border-radius:999px;padding:9px 16px;border-color:var(--line);transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.sm{padding:6px 12px}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 80%,transparent),inset 0 1px 0 rgb(255 255 255 / .18)}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=password],input[type=time],select,textarea{border-radius:var(--r-sm);padding:10px 13px;border-color:var(--line);background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.seg{border-radius:999px;padding:4px;background:var(--sunk)}
.seg button{border-radius:999px;padding:7px 14px}
.seg button[aria-pressed="true"]{box-shadow:0 2px 8px -2px rgb(46 28 18 / .18)}
.chip{padding:3px 10px}
.house{border-radius:8px}
th{background:color-mix(in srgb,var(--sunk) 70%,transparent);border-bottom:1px solid var(--line-soft);text-transform:none;letter-spacing:0;font-size:.8rem}
td{border-bottom-color:var(--line-soft)}
.row{border-top-color:var(--line-soft);padding:11px 0}
.user-opt{border-radius:16px;padding:12px 14px;transition:border-color .15s,background .15s}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px 26px;color:#fff;
  background:linear-gradient(135deg,#25663A 0%,#2F7A45 40%,#5E9B4A 100%);box-shadow:0 18px 40px -22px rgb(37 102 58 / .8)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#FAD25A 0%,#F2B01E 42%,rgb(242 176 30 / 0) 70%);pointer-events:none}

/* ===== Clean layer: neutral zinc palette, one green accent, flat surfaces, grouped sidebar ===== */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --sunk:#F4F4F5; --line:#E4E4E7; --line-soft:#ECECEE; --ink:#18181B; --muted:#71717A;
  --accent:#1F7A4D; --accent-ink:#FFFFFF; --accent-soft:#ECF6F0; --accent-2:#5FA97A;
  --sun:#E8A317; --sun-strong:#1F7A4D; --sun-soft:#F4F4F5; --tulip:#DC2626; --band:#E4E4E7; --band-soft:#F4F4F5;
  --ok:#15803D; --ok-soft:#EEF8F1; --warn:#B45309; --warn-soft:#FEF5E6; --bad:#DC2626; --bad-soft:#FEEFEF; --info:#2563EB; --info-soft:#EEF3FF;
  --f-display:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --f-ui:var(--f-display); --f-body:var(--f-display);
  --f-mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --side:248px;
  --shadow:0 1px 2px rgb(24 24 27 / .04); --shadow-lg:0 8px 30px -12px rgb(24 24 27 / .18); --glass:rgb(255 255 255 / .86);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090B; --surface:#111113; --sunk:#1A1A1D; --line:#27272A; --line-soft:#202023; --ink:#FAFAFA; --muted:#A1A1AA;
  --accent:#3FC07D; --accent-ink:#04130B; --accent-soft:#10261A; --accent-2:#3FC07D;
  --sun:#F0B43A; --sun-strong:#3FC07D; --sun-soft:#1A1A1D; --tulip:#F87171; --band:#27272A; --band-soft:#1A1A1D;
  --ok:#4ADE80; --ok-soft:#0F2417; --warn:#FBBF24; --warn-soft:#2A1F08; --bad:#F87171; --bad-soft:#2C1212; --info:#7AA7FF; --info-soft:#121B30;
  --shadow:0 0 0 rgb(0 0 0 / 0); --shadow-lg:0 12px 40px -12px rgb(0 0 0 / .7); --glass:rgb(17 17 19 / .86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#111113; --sunk:#1A1A1D; --line:#27272A; --line-soft:#202023; --ink:#FAFAFA; --muted:#A1A1AA;
  --accent:#3FC07D; --accent-ink:#04130B; --accent-soft:#10261A; --accent-2:#3FC07D;
  --sun:#F0B43A; --sun-strong:#3FC07D; --sun-soft:#1A1A1D; --tulip:#F87171; --band:#27272A; --band-soft:#1A1A1D;
  --ok:#4ADE80; --ok-soft:#0F2417; --warn:#FBBF24; --warn-soft:#2A1F08; --bad:#F87171; --bad-soft:#2C1212; --info:#7AA7FF; --info-soft:#121B30;
  --shadow:0 0 0 rgb(0 0 0 / 0); --shadow-lg:0 12px 40px -12px rgb(0 0 0 / .7); --glass:rgb(17 17 19 / .86); color-scheme:dark}

body{background:var(--bg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
h1,h2,h3{font-weight:600;letter-spacing:-.025em}
.sec-head h2{font-size:1.5rem}
.sec-head p{font-size:.875rem;margin-top:4px}
.muted{color:var(--muted)}

/* header & nav */
header.top{background:var(--glass);border-bottom:1px solid var(--line)}
header.top::before{display:none}
.mark.logo{height:34px;border-radius:8px;padding:2px 3px;box-shadow:0 0 0 1px var(--line)}
.brand h1{font-size:.98rem;font-weight:600;letter-spacing:-.015em}
.brand p{display:none}
.mode{font-size:.7rem;font-weight:500;padding:2px 8px;border-radius:6px}
.tab{border-radius:8px;padding:7px 11px;margin-block:8px;font-weight:500;color:var(--muted);box-shadow:none!important}
.tab svg{width:17px;height:17px;stroke-width:1.7}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sunk);color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--ink)}
.tab .ct{background:transparent;color:var(--muted);font-size:.72rem;font-weight:500;padding:0}
.tab .ct.hot{background:var(--bad);color:#fff;padding:0 6px;border-radius:99px}
.tab[aria-selected="true"] .ct{background:transparent;color:var(--muted)}
.tab[aria-selected="true"] .ct.hot{background:var(--bad);color:#fff}
.nav-grp{display:none}
.who{background:transparent;border:0;padding:0}
.who img,.av{width:28px;height:28px}

/* surfaces */
.panel,.tile,.kel,article.info,.tbl-wrap,.list-mobile,.kw{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);background:var(--surface)}
.panel{padding:20px}
.panel h3{font-size:.92rem;font-weight:600;margin-bottom:14px;letter-spacing:-.01em}
.panel h3 small{font-weight:400}
.empty{border:1px dashed var(--line);background:transparent;border-radius:var(--r);color:var(--muted)}
.tiles{gap:12px}

.tile .lbl{font-size:.8rem;font-weight:500;color:var(--muted);padding-right:24px}
.tile .val{font-weight:600;letter-spacing:-.03em;font-size:clamp(1.2rem,13.5cqi,1.75rem)}
.tile .sub{font-size:.78rem}
.ti{position:absolute;top:14px;right:14px;width:auto;height:auto;margin:0;background:none!important;color:var(--muted)!important}
.ti svg{width:16px;height:16px}
.meter{height:4px;background:var(--sunk)}
.meter i{background:var(--accent)}
.kel{border-left-width:3px}
.row{border-top-color:var(--line-soft);padding:12px 0}
.row .t{font-weight:500}

/* controls */
.btn{border-radius:8px;padding:7px 12px;font-weight:500;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 1px 1px rgb(24 24 27 / .04)}

.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 1px 2px rgb(24 24 27 / .15)}
.btn.pri:hover{background:var(--ink);opacity:.88;filter:none}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
a.btn.wa{background:var(--surface);border-color:var(--line);color:var(--ok)}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=password],input[type=time],input[type=datetime-local],select,textarea{
  border-radius:8px;padding:8px 11px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 1px rgb(24 24 27 / .03)}
input:focus,select:focus,textarea:focus{border-color:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 9%,transparent)}
.fld label{font-size:.8rem;font-weight:500}
.seg{border-radius:9px;padding:3px;background:var(--sunk);gap:2px}
.seg button,.pill-r span{border-radius:7px;padding:5px 11px;font-weight:500;font-size:.82rem}
.seg button[aria-pressed="true"],.pill-r input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(24 24 27 / .1),0 0 0 1px var(--line)}
.chip{border-radius:6px;font-size:.72rem;font-weight:500;padding:2px 7px;gap:5px}
.chip::before{width:5px;height:5px}
.house{font-family:var(--f-mono);background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-radius:6px;font-size:.76rem;padding:1px 6px}
th{background:transparent;color:var(--muted);font-weight:500;font-size:.78rem;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--line)}
td{border-bottom-color:var(--line-soft)}
tbody tr:hover{background:var(--sunk)}
.notice{border-radius:10px;font-size:.85rem}
.user-opt{border-radius:10px;padding:10px 12px}
.user-opt[aria-pressed="true"]{background:var(--sunk);border-color:var(--ink);box-shadow:none}
.amt-in{color:var(--ok)} .amt-out{color:var(--ink)}
td.out{color:var(--ink)}

/* greeting (was gradient hero) */
.hero{background:none;box-shadow:none;color:var(--ink);padding:4px 0 2px;border-radius:0;display:grid;grid-template-columns:1fr auto;column-gap:24px;align-items:end}
.hero::before,.hero::after{display:none}
.hero .hi{grid-column:1;color:var(--muted);font-size:.85rem;opacity:1}
.hero h2{grid-column:1;color:var(--ink);font-size:1.75rem;margin:0}
.hero .dt{grid-column:1;color:var(--muted);opacity:1;font-size:.85rem;margin-top:2px}
.hero .qa{grid-column:2;grid-row:1/4;margin:0;align-self:end}
.qa button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:500;font-size:.82rem;backdrop-filter:none;box-shadow:0 1px 1px rgb(24 24 27 / .04)}
.qa button:hover{background:var(--sunk)}
.qa svg{width:15px;height:15px;color:var(--muted)}

/* charts: neutral bars, accent for the current period */
.chart rect[fill-opacity="0.55"],.chart rect[fill-opacity="0.32"]{fill:var(--line);fill-opacity:1}
.chart rect[fill="var(--sun-strong)"]{fill:var(--accent)}
.chart rect[fill="var(--tulip)"]{fill:var(--ink)}
.cat-bar .tr{height:6px} .cat-bar .tr i,button.cat-bar .tr i{background:var(--ink)}
button.cat-bar.on{background:var(--sunk)}

/* dialog, toast, login */
dialog{border-radius:14px;border:1px solid var(--line);box-shadow:0 24px 60px -20px rgb(0 0 0 / .35)}
dialog::backdrop{background:rgb(9 9 11 / .45);backdrop-filter:blur(2px)}
.dlg-h{padding:18px 20px 6px}
.dlg-h h3{font-size:1.05rem;font-weight:600}
.dlg-b{padding:8px 20px 16px}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line)}
.toast{border-radius:10px;font-size:.85rem;padding:10px 14px}
.login{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-lg);background:var(--surface);padding:32px 28px}
.logo-login{height:84px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.login h2{font-size:1.35rem}
.sos-card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.aman-ok{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}

function chart6() {

    s += `<rect x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(h, d.has ? 2 : 0)}" rx="4" fill="${last ? 'var(--sun-strong)' : 'var(--accent)'}" fill-opacity="${last ? 1 : .55}"/>`;

  });
  return s + '</svg>';
}

async function mzSimpan() {
  const z = mzState(), rows = [], ringkas = [];
  for (const id of z.sel) {
    const w = wById(id); if (!w) continue;
    const jumlah = Number(z.jml[id] ?? nominal()) || 0, pers = mzPeriode(w, z.per, Number(z.bln[id]) || 1);
    for (const p of pers) rows.push({id: `${w.id}_${p}`, data: {wargaId: w.id, periode: p, jumlah, tanggal: z.tgl, metode: z.met[id] || z.metode, catatan: 'Entry massal', dicatat: todayISO(), oleh: (S.me && S.me.id) || '', olehSesi: S.sesi || ''}});
    if (pers.length) ringkas.push(`${w.blok} · ${w.nama}: ${pers.length} bln × ${rp(jumlah)}`);
  }
  if (!rows.length) { toast('Tidak ada pembayaran baru untuk disimpan.', 'bad'); return; }
  const total = rows.reduce((s, r) => s + r.data.jumlah, 0);
  openDlg({
    title: 'Simpan pembayaran massal?', submitLabel: `Simpan ${rows.length} catatan`, area: 'iuran',
    body: `<p style="margin:0">Tanggal bayar <b>${esc(tgl(z.tgl))}</b>, total <b>${esc(rp(total))}</b> untuk ${ringkas.length} KK.</p>
      <div class="panel" style="max-height:240px;overflow:auto;padding:10px 12px;background:var(--sunk);border:0;font-size:.86rem">${ringkas.map(t => `<div>${esc(t)}</div>`).join('')}</div>`,
    onSubmit: async () => {
      if (!bisa('iuran')) { pesanDlg('Peran Anda tidak bisa mengubah iuran.'); return false; }
      if (!z.tgl) { pesanDlg('Isi tanggal bayar.'); return false; }
      let simpan = 0;
      for (let i = 0; i < rows.length; i += 200) {
        const chunk = rows.slice(i, i + 200);
        const {data, error} = await SB.from('dokumen').upsert(chunk.map(r => ({koleksi: 'iuran', id: r.id, data: r.data})), {onConflict: 'koleksi,id', ignoreDuplicates: true}).select('id,data');
        if (error) { pesanDlg(`Gagal menyimpan${simpan ? ` (${simpan} catatan sudah tersimpan)` : ''}: ${sbErr(error).code === 'ditolak' ? 'role Anda tidak punya izin mengubah iuran.' : error.message}`); return false; }
        for (const r of data || []) taruh('iuran', r.id, r.data);
        simpan += (data || []).length;
      }
      sinkron('iuran'); S.mz = null; sbSched();
      toast(`${simpan} pembayaran iuran tersimpan${simpan < rows.length ? ` (${rows.length - simpan} sudah tercatat sebelumnya)` : ''}.`);
      return true;
    }
  });
}

function pilihanLogin() {
  const me = S.me || {}, list = [];
  if (bolehPemilik()) {
    const pin = !!S.keamanan.pinHash;
    list.push({id: 'pemilik', nama: S.mode === 'online' ? (me.name || 'Pemilik aplikasi') : 'Pemilik', sub: 'Pemilik · semua menu dan Admin', uid: me.id, img: me.avatarUrl, pin, boleh: true});
  }
  for (const p of pengurusAktif()) {
    const r = roleById(p.peranId), milikSaya = !!(me.id && p.userId === me.id);
    const pin = !!p.pinHash && !milikSaya;
    list.push({id: p.id, nama: p.nama, sub: `${p.jabatan || 'Pengurus'} · role ${r ? r.nama : '(belum ada)'}`, uid: p.userId, pin, milikSaya,
      boleh: pin || milikSaya || S.mode !== 'online'});
  }
  const a = aksesLama();
  if (a && !pengurusSaya()) list.push({id: 'akses', nama: me.name || 'Akun Anda', sub: roleById(LEGACY[a.peran]).nama, uid: me.id, img: me.avatarUrl, pin: false, boleh: true});
  return list;
}

const tglSurat = iso => { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return `${d} ${BLN_L[m - 1]} ${y}`; };
function terbilang(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => x < 12 ? s[x] : x < 20 ? f(x - 10) + ' belas' : x < 100 ? f(Math.floor(x / 10)) + ' puluh ' + f(x % 10)
    : x < 200 ? 'seratus ' + f(x - 100) : x < 1000 ? f(Math.floor(x / 100)) + ' ratus ' + f(x % 100)
    : x < 2000 ? 'seribu ' + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + ' ribu ' + f(x % 1000)

const KAT_KELUAR = ['Kebersihan & sampah', 'Keamanan / satpam', 'Listrik & air fasum', 'Perbaikan fasilitas', 'Kegiatan warga', 'Sosial / duka / sakit', 'Administrasi & ATK', 'Lainnya'];

const saldoCutoff = () => { const d = S.keuangan.find(x => x.id === 'saldoAwal'); return d ? {jumlah: Number(d.jumlah) || 0, tanggal: d.tanggal || '', catatan: d.catatan || '', oleh: d.olehNama || '', diatur: d.diatur || ''} : {jumlah: Number(S.set.saldoAwal) || 0, tanggal: S.set.saldoTgl || '', catatan: '', oleh: '', diatur: ''}; };
function kasSemua() {
  const byTgl = new Map();
  for (const p of S.iuran) { if (!p.tanggal) continue; const g = byTgl.get(p.tanggal) || {n: 0, j: 0}; g.n++; g.j += Number(p.jumlah) || 0; byTgl.set(p.tanggal, g); }
  const auto = [...byTgl].map(([t, g]) => ({id: 'iur_' + t, jenis: 'masuk', tanggal: t, kategori: 'Iuran warga', uraian: `Iuran warga · ${g.n} pembayaran`, jumlah: g.j, auto: true}));
  const mulai = saldoCutoff().tanggal;
  const sb = sbKasRows();
  return [...auto, ...sb.masuk, ...sb.keluar, ...S.kas.filter(x => x.tanggal)].filter(x => !mulai || x.tanggal >= mulai);
}
const nilai = x => (x.jenis === 'masuk' ? 1 : -1) * (Number(x.jumlah) || 0);
const saldoSebelum = iso => saldoCutoff().jumlah + kasSemua().filter(x => x.tanggal < iso).reduce((s, x) => s + nilai(x), 0);

function rekapKas(per) {
  const list = kasSemua().filter(x => x.tanggal.slice(0, 7) === per).sort((a, b) => a.tanggal.localeCompare(b.tanggal) || (a.auto ? -1 : 1));
  const masuk = list.filter(x => x.jenis === 'masuk').reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
  const keluar = list.filter(x => x.jenis !== 'masuk').reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
  const awal = saldoSebelum(per + '-01');
  const perKat = {}; for (const x of list) if (x.jenis !== 'masuk') perKat[x.kategori] = (perKat[x.kategori] || 0) + (Number(x.jumlah) || 0);
  const iur = list.filter(x => x.auto && x.kategori === 'Iuran warga').reduce((s, x) => s + x.jumlah, 0);
  return {list, masuk, keluar, awal, akhir: awal + masuk - keluar, perKat, iur};
}

function xlsxSumbangan(p) {
  const st = S.set, h = sbHitung(p), W = MiniXlsx.sheet([6, 14, 34, 12, 16, 16, 22]), K = W.ST;
  const sec = t => W.skip().put(0, t, K.bold, 7).next();
  W.put(0, `PENGURUS RT ${st.rt || '…'} / RW ${st.rw || '…'}`, K.kop, 7).next();
  W.put(0, lingk(), 0, 7).next().skip();
  W.put(0, 'LAPORAN SUMBANGAN', K.title, 7).next();
  W.put(0, p.nama, K.sub, 7).next();
  W.put(0, `${p.jenis || ''} · ${p.sifat === 'rumah' ? 'per rumah ' + rp(p.nominal) : 'sukarela'} · ${tgl(p.mulai)}${p.selesai ? ' s.d. ' + tgl(p.selesai) : ''} · ${p.status === 'Selesai' ? 'Selesai' : 'Aktif'}`, K.note, 7).next();
  sec('I. RINGKASAN');
  const r = (l, v, s = K.rp) => W.put(0, l, K.text, 5).put(5, v, s, 2).next();
  r('Total terkumpul', h.terkumpul); if (h.target) r(`Target${h.targetAuto ? ' (otomatis)' : ''}`, h.target);
  r('Jumlah penyumbang', h.masuk.length, K.num); r('Rumah ikut menyumbang', `${h.rumah.size} dari ${h.totalRumah}`, K.text);
  r('Total disalurkan', h.disalurkan, K.negRp);
  W.put(0, 'Sisa dana', K.akhirText, 5).put(5, h.sisa, K.akhirRp, 2).next();
  sec('II. DAFTAR PENYUMBANG');
  W.put(0, 'No', K.headC).put(1, 'Tanggal', K.head).put(2, 'Nama', K.head).put(3, 'Rumah', K.head).put(4, 'Metode', K.head).put(5, 'Jumlah', K.headR).put(6, 'Catatan', K.head).next();
  if (!h.masuk.length) W.put(0, 'Belum ada sumbangan', K.center, 7).next();
  h.masuk.slice().reverse().forEach((d, i) => W.put(0, i + 1, K.center).put(1, tgl(d.tanggal), K.text).put(2, (d.nama || '') + (d.anonim ? ' (anonim)' : ''), K.text).put(3, d.blok || 'luar', K.text).put(4, d.metode || 'Tunai', K.text).put(5, Number(d.jumlah) || 0, K.num).put(6, d.catatan || '', K.text).next());
  W.put(0, '', K.totText).put(1, '', K.totText).put(2, 'Jumlah', K.totText).put(3, '', K.totText).put(4, '', K.totText).put(5, h.terkumpul, K.totNum).put(6, '', K.totText).next();
  sec('III. PENYALURAN DANA');
  W.put(0, 'No', K.headC).put(1, 'Tanggal', K.head).put(2, 'Uraian', K.head).put(3, 'Metode', K.head).put(4, 'Penerima', K.head).put(5, 'Jumlah', K.headR).put(6, 'No. nota', K.head).next();
  if (!h.salur.length) W.put(0, 'Belum ada penyaluran', K.center, 7).next();
  h.salur.slice().reverse().forEach((x, i) => W.put(0, i + 1, K.center).put(1, tgl(x.tanggal), K.text).put(2, x.uraian || '', K.text).put(3, x.metode || '', K.text).put(4, x.penerima || '', K.text).put(5, Number(x.jumlah) || 0, K.num).put(6, x.noNota || '', K.text).next());
  W.put(0, '', K.totText).put(1, '', K.totText).put(2, 'Jumlah', K.totText).put(3, '', K.totText).put(4, '', K.totText).put(5, h.disalurkan, K.totNum).put(6, '', K.totText).next();
  W.skip();
  W.put(0, 'Dibuat oleh,', K.sign, 3).put(4, `${st.kota || lingk()}, ${tglSurat(todayISO())}`, K.sign, 3).next();
  W.put(0, 'Bendahara', K.sign, 3).put(4, `Mengetahui, Ketua RT ${st.rt || ''}`.trim(), K.sign, 3).next();
  W.skip(3);
  W.put(0, namaBendahara() || '(..............................)', K.signB, 3).put(4, namaKetua() || '(..............................)', K.signB, 3).next();
  return W.build('Sumbangan');
}

  W.put(0, lingk() + (wil ? ' · ' + wil : ''), 0, 7).next().skip();
  W.put(0, 'LAPORAN KEUANGAN KAS RT', K.title, 7).next();
  W.put(0, 'Periode ' + g.lbl, K.sub, 7).next();
  // I. Ringkasan
  const akhirTgl = g.akhir > todayISO() && g.awal <= todayISO() ? todayISO() : g.akhir, sel = L.tMasuk - L.tKeluar;
  sec('I. RINGKASAN');
  W.put(0, 'Saldo awal per ' + tglSurat(g.awal), K.text, 5).put(5, L.awal, K.rp, 2).next();
  W.put(0, 'Total penerimaan', K.text, 5).put(5, L.tMasuk, K.rp, 2).next();
  W.put(0, 'Total pengeluaran', K.text, 5).put(5, L.tKeluar, K.negRp, 2).next();
  W.put(0, 'Surplus / (defisit) periode ini', K.text, 5).put(5, Math.abs(sel), sel < 0 ? K.negRp : K.rp, 2).next();
  W.put(0, 'Saldo akhir per ' + tglSurat(akhirTgl), K.akhirText, 5).put(5, L.akhir, K.akhirRp, 2).next();

    sec(judul);
    W.put(0, 'No', K.headC).put(1, kolom, K.head, 4).put(5, 'Jumlah', K.headR).put(6, '%', K.headR).next();

  };

  kat('III. PENGELUARAN', 'Pos pengeluaran', L.keluar, L.tKeluar, 'Total pengeluaran');
  // IV. Iuran
  sec('IV. PENERIMAAN IURAN WARGA');
  W.put(0, 'Bulan', K.head, 2).put(2, 'KK wajib', K.headR).put(3, 'KK lunas', K.headR).put(4, 'Kepatuhan', K.headR).put(5, 'Target', K.headR).put(6, 'Terkumpul', K.headR).next();
  L.iuran.forEach(r => W.put(0, perLbl(r.per, true), K.text, 2).put(2, r.total, K.num).put(3, r.lunas, K.num).put(4, r.total ? r.lunas / r.total : 0, K.pct).put(5, r.target, K.rp).put(6, r.terkumpul, K.rp).next());
  if (L.iuran.length > 1) {
    const t = L.iuran.reduce((a, r) => ({total: a.total + r.total, lunas: a.lunas + r.lunas, t: a.t + r.terkumpul, g: a.g + r.target}), {total: 0, lunas: 0, t: 0, g: 0});
    W.put(0, 'Jumlah', K.totText, 2).put(2, t.total, K.totNum).put(3, t.lunas, K.totNum).put(4, t.total ? t.lunas / t.total : 0, K.totPct).put(5, t.g, K.totRp).put(6, t.t, K.totRp).next();
  }
  const tb = L.tung.reduce((a, r) => a + r[1].length, 0);
  W.put(0, `Tunggakan per ${tglSurat(todayISO())}: ${L.tung.length} KK, ${tb} bulan, sekitar ${rp(tb * nominal())}.`, K.note, 7).next();
  // V. Rincian
  sec('V. RINCIAN TRANSAKSI');
  W.put(0, 'No', K.headC).put(1, 'Tanggal', K.head).put(2, 'Uraian', K.head).put(3, 'Kategori', K.head).put(4, 'Masuk', K.headR).put(5, 'Keluar', K.headR).put(6, 'Saldo', K.headR).next();
  W.put(0, '', K.subRow).put(1, '', K.subRow).put(2, 'Saldo awal', K.subRow).put(3, '', K.subRow).put(4, '', K.subRow).put(5, '', K.subRow).put(6, L.awal, K.subNum).next();
  let run = L.awal;
  if (!L.tx.length) W.put(0, 'Tidak ada transaksi pada periode ini', K.center, 7).next();
  L.tx.forEach((t, i) => {
    run += nilai(t);
    W.put(0, i + 1, K.center).put(1, tgl(t.tanggal), K.text).put(2, (t.uraian || '') + (t.penerima ? ' · ' + t.penerima : ''), K.text).put(3, t.kategori || '', K.text)
      .put(4, t.jenis === 'masuk' ? Number(t.jumlah) || 0 : '', K.num).put(5, t.jenis !== 'masuk' ? Number(t.jumlah) || 0 : '', K.num).put(6, run, K.num).next();
  });
  W.put(0, '', K.totText).put(1, '', K.totText).put(2, 'Jumlah', K.totText).put(3, '', K.totText).put(4, L.tMasuk, K.totNum).put(5, L.tKeluar, K.totNum).put(6, L.akhir, K.totNum).next();
  W.put(0, 'Pemasukan iuran dijumlahkan per tanggal bayar dan sumbangan per program per tanggal. Rincian tersedia di menu Iuran dan Sumbangan.', K.note, 7).next();
  // tanda tangan
  W.skip();
  W.put(0, 'Dibuat oleh,', K.sign, 3).put(4, `${st.kota || lingk()}, ${tglSurat(todayISO())}`, K.sign, 3).next();
  W.put(0, 'Bendahara', K.sign, 3).put(4, `Mengetahui, Ketua RT ${st.rt || ''}`.trim(), K.sign, 3).next();
  W.skip(3);
  W.put(0, namaBendahara() || '(..............................)', K.signB, 3).put(4, namaKetua() || '(..............................)', K.signB, 3).next();
  return W.build('Laporan ' + g.kode);
}

/* ---------- ekspor CSV ---------- */
function csv(rows) { return rows.map(r => r.map(v => { const t = String(v ?? ''); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(';')).join('\r\n'); }
function ekspor(k, per) {
  const tag = lingk().replace(/\s+/g, '-');
  const W = [...S.warga].sort(sortHouse);
  let rows, name;
  if (k === 'warga') { name = `Data-warga-${tag}`; rows = [['Blok/No','Nama kepala keluarga','NIK','No HP','Agama','Jumlah jiwa','Status huni','Status','Wajib iuran mulai','Tunggakan (bulan)','Catatan'],
    ...W.map(w => [w.blok, w.nama, w.nik, w.noHp, agamaLbl(w.agama), w.jumlahJiwa, w.statusHuni, w.status, mulaiTgl(w), tunggakan(w), w.catatan])]; }
  else if (k === 'anggota') { name = `Anggota-keluarga-${tag}`; rows = [['Blok/No','Kepala keluarga','Nama anggota','Hubungan','Jenis kelamin','Agama','Tanggal lahir','Umur','NIK'],
    ...W.flatMap(w => [[w.blok, w.nama, w.nama, 'Kepala keluarga', w.jk === 'P' ? 'Perempuan' : w.jk === 'L' ? 'Laki-laki' : '', agamaLbl(w.agama), w.lahir, umur(w.lahir), w.nik], ...(w.anggota || []).map(a => [w.blok, w.nama, a.nama, a.hubungan, a.jk === 'P' ? 'Perempuan' : 'Laki-laki', agamaLbl(a.agama || w.agama), a.lahir, umur(a.lahir), a.nik])])]; }
  else if (k === 'iuran') { name = `Riwayat-iuran-${tag}`; rows = [['Periode','Blok/No','Nama','Jumlah','Tanggal bayar','Metode','No kwitansi','Catatan'],
    ...[...S.iuran].sort((a, b) => b.periode.localeCompare(a.periode)).map(p => { const w = wById(p.wargaId) || {}; return [p.periode, w.blok, w.nama, p.jumlah, p.tanggal, p.metode, kwNomor(p), p.catatan]; })]; }
  else if (k === 'tunggakan') { name = `Tunggakan-${tag}-${todayISO()}`; rows = [['Blok/No','Nama','No HP','Jumlah bulan','Bulan tertunggak','Total (Rp)'],
    ...W.map(w => [w, tunggakanList(w)]).filter(x => x[1].length).map(([w, l]) => [w.blok, w.nama, w.noHp, l.length, l.map(p => perLbl(p)).join(', '), l.length * nominal()])]; }
  else if (k === 'kas') { const all = kasSemua().filter(x => !per || x.tanggal.slice(0, 7) === per).sort((a, b) => a.tanggal.localeCompare(b.tanggal));
    let run = per ? rekapKas(per).awal : saldoCutoff().jumlah;
    name = per ? `Laporan-kas-${tag}-${per}` : `Buku-kas-${tag}`;
    rows = [['Tanggal','Jenis','Kategori','Uraian','Masuk','Keluar','Saldo'], ['', '', '', 'Saldo awal', '', '', run],
      ...all.map(x => { run += nilai(x); return [x.tanggal, x.jenis === 'masuk' ? 'Pemasukan' : 'Pengeluaran', x.kategori, x.uraian, x.jenis === 'masuk' ? x.jumlah : '', x.jenis !== 'masuk' ? x.jumlah : '', run]; })]; }
  else if (k === 'keluhan') { name = `Keluhan-${tag}`; rows = [['Tanggal','Judul','Kategori','Prioritas','Status','Pelapor','Lokasi','Uraian','Tanggapan'],
    ...S.keluhan.map(x => { const w = x.wargaId && wById(x.wargaId); return [x.dibuat, x.judul, x.kategori, x.prioritas, x.status, w ? `${w.blok} ${w.nama}` : x.pelaporNama, x.lokasi, x.isi, x.tanggapan]; })]; }
  else if (k === 'surat') { name = `Agenda-surat-${tag}`; rows = [['Nomor','Tanggal','Jenis','Pemohon','NIK','Keperluan'],
    ...[...S.surat].sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal))).map(x => [x.nomor, x.tanggal, x.jenis, x.pemohon && x.pemohon.nama, x.pemohon && x.pemohon.nik, x.keperluan])]; }
  if (!rows || rows.length < 2) { toast('Belum ada data untuk diunduh.', 'bad'); return; }
  unduh(name + '.csv', csv(rows));
}
